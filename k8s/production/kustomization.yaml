apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mindelta

resources:
- ../namespace.yaml
- ../configmap.yaml
- ../secrets.yaml
- ../backend-deployment.yaml
- ../ingress.yaml
- ../hpa.yaml

patchesStrategicMerge:
- backend-patch.yaml

configMapGenerator:
- name: mindelta-config
  literals:
  - NODE_ENV=production
  - CORS_ORIGIN=https://mindelta.com

replicas:
- name: mindelta-backend
  count: 3
