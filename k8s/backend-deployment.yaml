apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindelta-backend
  namespace: mindelta
  labels:
    app: mindelta-backend
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mindelta-backend
  template:
    metadata:
      labels:
        app: mindelta-backend
        tier: backend
    spec:
      containers:
      - name: mindelta-backend
        image: ghcr.io/mindelta/mindelta-backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: mindelta-config
        - secretRef:
            name: mindelta-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1001
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: mindelta-backend-service
  namespace: mindelta
  labels:
    app: mindelta-backend
spec:
  selector:
    app: mindelta-backend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
