apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mindelta-staging

resources:
- ../namespace.yaml
- ../configmap.yaml
- ../secrets.yaml
- ../backend-deployment.yaml
- ../ingress.yaml
- ../hpa.yaml

patchesStrategicMerge:
- backend-patch.yaml

configMapGenerator:
- name: mindelta-config
  literals:
  - NODE_ENV=staging
  - CORS_ORIGIN=https://staging.mindelta.com

replicas:
- name: mindelta-backend
  count: 2
