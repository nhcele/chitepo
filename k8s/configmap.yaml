apiVersion: v1
kind: ConfigMap
metadata:
  name: mindelta-config
  namespace: mindelta
data:
  NODE_ENV: "production"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "mindelta"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio-service"
  MINIO_PORT: "9000"
  AWS_REGION: "us-east-1"
  JWT_SECRET: "prod-jwt-secret-change-me"
  CORS_ORIGIN: "https://mindelta.com"
