# Apache2 Virtual Host Configuration for Chitepo Project
# 
# Installation:
# 1. Copy this file to /etc/apache2/sites-available/
# 2. Enable required modules: sudo a2enmod proxy proxy_http headers rewrite ssl
# 3. Enable sites: sudo a2ensite chitepo-api.conf chitepo-frontend.conf
# 4. Test: sudo apache2ctl configtest
# 5. Restart: sudo systemctl restart apache2

# Backend API Virtual Host
<VirtualHost *:80>
    ServerName api.your-domain.com
    
    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Backend API proxy
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
    
    # Headers for proper proxying
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/chitepo-api-error.log
    CustomLog ${APACHE_LOG_DIR}/chitepo-api-access.log combined
    
    # Log level (adjust as needed)
    LogLevel warn
</VirtualHost>

# Frontend Virtual Host
<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    
    # Proxy settings
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Enable rewrite engine for WebSocket support
    RewriteEngine On
    
    # WebSocket support
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:3001/$1 [P,L]
    
    # Regular HTTP proxy
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule /(.*) http://localhost:3001/$1 [P,L]
    
    # Alternative: Simple proxy (if WebSocket not needed)
    # ProxyPass / http://localhost:3001/
    # ProxyPassReverse / http://localhost:3001/
    
    # Headers for proper proxying
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    RequestHeader set X-Real-IP %{REMOTE_ADDR}s
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/chitepo-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/chitepo-frontend-access.log combined
    
    # Log level (adjust as needed)
    LogLevel warn
</VirtualHost>

