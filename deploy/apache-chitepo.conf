# Chitepo LMS - Apache virtual host (reverse proxy to the PM2 apps).
#
#   sudo cp deploy/apache-chitepo.conf /etc/apache2/sites-available/chitepo.conf
#   sudo a2enmod proxy proxy_http headers rewrite
#   sudo a2ensite chitepo
#   sudo systemctl reload apache2
#   sudo certbot --apache -d chitepo.example.com     # adds HTTPS + :443 vhost
#
# >>> Replace chitepo.example.com with your real subdomain everywhere below. <<<
# This is a NEW vhost; your existing sites are untouched.

<VirtualHost *:80>
    ServerName chitepo.example.com

    ProxyPreserveHost On
    ProxyRequests Off

    # API -> NestJS backend (PM2: chitepo-backend on 4001). Must come first.
    ProxyPass        /api  http://127.0.0.1:4001/api
    ProxyPassReverse /api  http://127.0.0.1:4001/api

    # Everything else -> Next.js frontend (PM2: chitepo-frontend on 4000)
    ProxyPass        /  http://127.0.0.1:4000/
    ProxyPassReverse /  http://127.0.0.1:4000/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/chitepo-error.log
    CustomLog ${APACHE_LOG_DIR}/chitepo-access.log combined
</VirtualHost>
