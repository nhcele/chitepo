# Chitepo LMS — reverse-proxy rules for serving the app under  huku.tech/chitepo
#
# These lines go INSIDE your EXISTING huku.tech virtual host — the HTTPS
# <VirtualHost *:443> block that certbot manages for your current site — placed
# ABOVE any existing "ProxyPass /" or DocumentRoot handling. Do NOT create a new
# vhost for huku.tech; that would clash with the site already there.
#
# Enable the proxy modules once:
#   sudo a2enmod proxy proxy_http headers
#   sudo systemctl reload apache2
#
# ORDER MATTERS — Apache uses the first matching ProxyPass, so the most specific
# rules must come first. Keep this exact order.

ProxyPreserveHost On

# /api/placeholder is a Next.js API route (placeholder images) -> stays on the
# FRONTEND. Must come before the /chitepo/api -> backend rule below.
ProxyPass        /chitepo/api/placeholder  http://127.0.0.1:4000/chitepo/api/placeholder
ProxyPassReverse /chitepo/api/placeholder  http://127.0.0.1:4000/chitepo/api/placeholder

# All other API calls -> NestJS backend (drop /chitepo; backend uses /api prefix)
ProxyPass        /chitepo/api      http://127.0.0.1:4001/api
ProxyPassReverse /chitepo/api      http://127.0.0.1:4001/api

# Files uploaded through the app, served by the backend
ProxyPass        /chitepo/uploads  http://127.0.0.1:4001/uploads
ProxyPassReverse /chitepo/uploads  http://127.0.0.1:4001/uploads

# Everything else under /chitepo -> Next.js frontend (basePath keeps the prefix)
ProxyPass        /chitepo          http://127.0.0.1:4000/chitepo
ProxyPassReverse /chitepo          http://127.0.0.1:4000/chitepo
